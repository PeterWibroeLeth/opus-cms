backend:
  name: github
  repo: PeterWibroeLeth/opus-cms
  branch: main

media_folder: static/img
public_folder: /img

collections:
  - name: docs
    label: Docs
    folder: docs
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Sidebar Position, name: sidebar_position, widget: number, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: blog
    label: Blog
    folder: blog
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Authors, name: authors, widget: list, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Body, name: body, widget: markdown }